<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión • Instagram</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">    <!-- Script de JavaScript -->
    <script src="codigo.js" defer></script>
</head>
<body>

    <div class="login-card">
        <h1 class="instagram-logo">Instagram</h1>

        <form onsubmit="iniciarSesion(event)">
            <input type="text" class="form-control" id="usuario" placeholder="Teléfono, usuario o correo electrónico" required>
            <input type="password" class="form-control" id="contraseña" placeholder="Contraseña" required>
            <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        </form>

        <div id="contenedor-alerta" class="d-none">
            <div id="mensaje" class="alert" role="alert"></div>
        </div>


    </div>

</body>
</html>
